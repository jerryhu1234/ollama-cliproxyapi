<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ollama Usage Prediction</title>
<style>
:root {
  --bg-primary: #f0eee8;
  --bg-secondary: #faf9f5;
  --bg-tertiary: #e9e6df;

  --text-tertiary: #a29c95;
  --border-color: #e3e1db;
  --primary-color: #8b8680;
  --primary-hover: #7f7a74;
  --success-color: #188038;
  --warning-color: #b06000;
  --error-color: #b3261e;
  --radius-md: 8px;
  --shadow: 0 1px 3px rgba(45, 42, 38, .12);
}
[data-theme="white"] {
  --bg-primary: #f0eee8;
  --bg-secondary: #faf9f5;
  --bg-tertiary: #e9e6df;
  --text-primary: #2d2a26;
  --text-secondary: #6d6760;
  --text-tertiary: #a29c95;
  --border-color: #e3e1db;
}
[data-theme="dark"] {
  --bg-primary: #1d1b18;
  --bg-secondary: #151412;
  --bg-tertiary: #262320;
  --text-primary: #f0eee8;
  --text-secondary: #b8b1a8;
  --text-tertiary: #8d867e;
  --border-color: #3c3833;
  --primary-color: #8f8981;
  --primary-hover: #a29b92;
  --shadow: 0 1px 3px rgba(0, 0, 0, .35);
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { margin: 0; padding: 32px; color: var(--text-primary); background: var(--bg-secondary); font: 14px/1.45 system-ui, sans-serif; }
.pred-page { max-width: 1160px; margin: 0 auto; }
.pred-header { margin-bottom: 24px; }
.pred-title { margin: 0; font-size: 28px; font-weight: 700; line-height: 1.2; }
.pred-description { margin: 8px 0 0; color: var(--text-secondary); }
.pred-meta { margin: 10px 0 0; color: var(--text-secondary); font-size: 13px; }
.pred-meta strong { color: var(--text-primary); }
.pred-banner { display: flex; align-items: baseline; gap: 8px; margin: 12px 0 0; padding: 10px 14px; border: 1px solid color-mix(in srgb, var(--warning-color) 45%, transparent); border-radius: var(--radius-md); background: color-mix(in srgb, var(--warning-color) 10%, transparent); color: var(--warning-color); font-size: 13px; }
.pred-banner .pred-banner-tag { font-weight: 700; text-transform: uppercase; font-size: 11px; letter-spacing: .04em; white-space: nowrap; }
.pred-banner .pred-banner-detail { color: var(--text-secondary); overflow-wrap: anywhere; }
.fleet-card { padding: 20px; margin-bottom: 16px; border: 1px solid var(--border-color); border-radius: var(--radius-md); background: var(--bg-primary); box-shadow: var(--shadow); }
.fleet-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 12px 20px; }
.fleet-label { font-size: 15px; font-weight: 700; }
.fleet-total { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
.fleet-sub { color: var(--text-secondary); font-size: 12px; }
.badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
.badge.risk-healthy { color: var(--success-color); background: color-mix(in srgb, var(--success-color) 12%, transparent); }
.badge.risk-tight { color: var(--warning-color); background: color-mix(in srgb, var(--warning-color) 14%, transparent); }
.badge.risk-critical { color: var(--error-color); background: color-mix(in srgb, var(--error-color) 12%, transparent); }
.badge.conf-high { color: var(--success-color); }
.badge.conf-medium { color: var(--warning-color); }
.badge.conf-low { color: var(--text-tertiary); }
.badge.state-exhausts-in { color: var(--warning-color); }
.badge.state-resets-first { color: var(--primary-color); }
.badge.state-exhausted { color: var(--error-color); }
.badge.state-stable { color: var(--success-color); }
.badge.state-no-data { color: var(--text-tertiary); }
.fleet-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px 18px; margin: 14px 0; }
.fleet-stat .k { color: var(--text-secondary); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
.fleet-stat .v { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
.fleet-stat .sub { color: var(--text-secondary); font-size: 11px; }
.projection { width: 100%; height: 96px; display: block; margin-top: 6px; }
.deadline-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 12px; }
.deadline-row label { color: var(--text-secondary); font-size: 12px; }
.deadline-row input { border: 1px solid var(--border-color); border-radius: 8px; padding: 7px 9px; color: var(--text-primary); background: var(--bg-secondary); font: inherit; font-size: 12px; }
.pred-btn { border: 1px solid var(--border-color); border-radius: 8px; padding: 8px 10px; color: var(--text-primary); background: var(--bg-tertiary); font: inherit; font-size: 12px; cursor: pointer; }
.pred-btn:hover { border-color: var(--primary-color); background: var(--bg-primary); }
.pred-btn:disabled { cursor: not-allowed; opacity: .6; }
.pred-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: 16px; }
.pred-card { padding: 20px; border: 1px solid var(--border-color); border-radius: var(--radius-md); background: var(--bg-primary); box-shadow: var(--shadow); }
.pred-card.is-dark { opacity: .55; }
.pred-card-header { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.credential-badge { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 50%; color: #fff; background: var(--primary-color); font-size: 12px; font-weight: 700; }
.credential-name { margin: 0; min-width: 0; overflow-wrap: anywhere; font-size: 16px; font-weight: 600; }
.pred-card-sub { color: var(--text-secondary); font-size: 12px; margin: 0 0 6px; }
.pred-row { padding: 12px 0; border-top: 1px solid var(--border-color); }
.pred-row-head { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
.pred-row-label { font-weight: 600; }
.pred-row-remaining { color: var(--text-secondary); font-variant-numeric: tabular-nums; }
.pred-track { height: 6px; margin: 7px 0 6px; overflow: hidden; border-radius: 999px; background: var(--bg-tertiary); }
.pred-fill { height: 100%; border-radius: inherit; background: var(--success-color); transition: width .2s ease; }
.pred-fill.warn { background: var(--warning-color); }
.pred-fill.bad { background: var(--error-color); }
.pred-eta { display: flex; align-items: baseline; gap: 10px; }
.pred-eta-main { font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; }
.pred-eta-sub { color: var(--text-secondary); font-size: 11px; }
.pred-row-meta { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 6px; color: var(--text-secondary); font-size: 11px; }
.spark { float: right; margin-left: 12px; }
.pred-muted { color: var(--text-secondary); }
.pred-error { color: var(--error-color); }
.pred-stale { color: var(--warning-color); }
.pred-header { position: relative; padding-right: 76px; }
.pred-lang { position: absolute; top: -2px; right: 0; min-width: 52px; font-weight: 600; }
@media (max-width: 768px) {
  body { padding: 20px 16px; }
  .pred-grid { grid-template-columns: 1fr; }
}

<div class="pred-page">
  <header class="pred-header">
    <button id="pred-lang" class="pred-btn pred-lang" type="button" aria-label="切换语言 / Switch language">中文</button>
    <h1 class="pred-title" id="pred-title">Ollama Usage Prediction</h1>
    <p class="pred-description" id="pred-description">Projected balance exhaustion per credential and per window, plus fleet capacity. Reads come from the plugin's local sample store — they never consume the account API's 10 req/min budget.</p>
    <p id="pred-meta" class="pred-meta" role="status" aria-live="polite">Loading samples...</p>
  </header>
  <main id="app"><p class="pred-muted">Loading samples...</p></main>
</div>
<script>
(() => {
  try {
    const parentDocument = window.parent && window.parent !== window ? window.parent.document : null;
    const parentRoot = parentDocument && parentDocument.documentElement;
    const syncTheme = () => {
      if (!parentRoot) return;
      const theme = parentRoot.getAttribute("data-theme");
      if (theme === "white" || theme === "dark") document.documentElement.setAttribute("data-theme", theme);
      else document.documentElement.removeAttribute("data-theme");
      const secondary = getComputedStyle(parentRoot).getPropertyValue("--bg-secondary").trim();
      if (secondary) document.documentElement.style.setProperty("--bg-secondary", secondary);
      document.body.style.backgroundColor = secondary || "var(--bg-secondary)";
      if (window.frameElement) {
        window.frameElement.style.backgroundColor = secondary || "transparent";
        if (window.frameElement.parentElement) window.frameElement.parentElement.style.backgroundColor = secondary || "transparent";
      }
    };
    syncTheme();
    if (parentRoot) new MutationObserver(syncTheme).observe(parentRoot, {attributes: true, attributeFilter: ["data-theme"]});
  } catch (_) {}
})();
</script>

    const w = windowLabel(win.gated_by);
    // Date deltas are ms; fmtDur speaks seconds.
    const dt = win.gated_at ? (new Date(win.gated_at).getTime() - Date.now()) / 1000 : NaN;
    return Number.isFinite(dt) && dt > 60000
      ? tf("gated-in", {d: fmtDur(dt), w: w})
      : tf("gated-now", {w: w});
  }
  function etaMain(win) {
    if (win.gated_by) return gatingNote(win);
    if (win.state === "exhausted") return t("state-exhausted");
    if (win.state === "no-data" || !win.eta_seconds) return "—";
    if (win.confidence === "high") return inDur(win.eta_seconds);
    if (win.confidence === "medium" && win.optimistic_eta_seconds && win.optimistic_eta_seconds !== win.eta_seconds) {
      return (t("eta-in") ? t("eta-in") + " " : "") + fmtDur(win.optimistic_eta_seconds) + "–" + fmtDur(win.eta_seconds) + t("eta-after");
    }
    const d = (win.eta_seconds || 0) / 86400;
    if (d >= 2) return "≈ " + (d >= 10 ? Math.round(d / 5) * 5 : d >= 5 ? Math.round(d) : Math.ceil(d)) + "d";
    return "≈ " + (win.eta_seconds >= 7200 ? Math.max(1, Math.round(win.eta_seconds / 3600)) + "h" : "<2h");
  }
  function etaSub(win) {
    if (win.gated_by) return tf("eta-sub-gated", {w: windowLabel(win.gated_by)});
    if (win.state === "resets-first") return tf("eta-sub-resets-first", {m: fmtMoney(win.burn_to_reset)});
    if (win.state === "stable") return t("eta-sub-stable");
    if (win.state === "exhausted") return t("eta-sub-exhausted") + (win.resets_at ? " " + new Date(win.resets_at).toLocaleString() : "");
    if (win.state === "no-data") return tf("eta-sub-no-data", {n: win.samples || 0});
    let sub = t("eta-sub-conservative");
    if (win.optimistic_rate_per_hour && win.optimistic_rate_per_hour < win.rate_per_hour) {
      sub += tf("eta-sub-optimistic", {}) + fmtRate(win.optimistic_rate_per_hour, win.unit);
    }
    if (win.shape_aware) sub += t("eta-sub-shape");
    return sub;
  }
  function windowLabel(name) {
    return (name && t("win-" + name) !== "win-" + name) ? t("win-" + name) : (name || "—");
  }
  function stateText(state) {
    return (state && t("state-" + state) !== "state-" + state) ? t("state-" + state) : state;
  }
  function sparkline(series, w, h) {
    const pts = (series || []).filter(p => Array.isArray(p) && p.length === 2 && Number.isFinite(p[0]) && Number.isFinite(p[1]));
    if (pts.length < 2) return null;
    let min = Infinity, max = -Infinity, minT = Infinity, maxT = -Infinity;
    pts.forEach(p => { min = Math.min(min, p[1]); max = Math.max(max, p[1]); minT = Math.min(minT, p[0]); maxT = Math.max(maxT, p[0]); });
    const span = max - min, spanT = maxT - minT || 1;
    const path = pts.map((p, i) => (i ? "L" : "M") + (((p[0] - minT) / spanT) * w).toFixed(1) + "," + (h - span > 0 ? (h - ((p[1] - min) / span) * h) : h).toFixed(1)).join(" ");
    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("viewBox", "0 0 " + w + " " + h);
    svg.setAttribute("width", w); svg.setAttribute("height", h); svg.setAttribute("class", "spark");
    const line = document.createElementNS("http://www.w3.org/2000/svg", "path");
    line.setAttribute("d", path); line.setAttribute("fill", "none");
    line.setAttribute("stroke", "var(--primary-color)"); line.setAttribute("stroke-width", "1.5");
    svg.appendChild(line);
    return svg;
  }
  function projectionChart(projection) {
    const pts = (projection || []).filter(p => Array.isArray(p) && p.length >= 2 && Number.isFinite(p[1]));
    const w = 560, h = 96;
    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("viewBox", "0 0 " + w + " " + h);
    svg.setAttribute("preserveAspectRatio", "none");
    svg.setAttribute("class", "projection");
    if (pts.length < 2) return svg;
    let max = 0;
    pts.forEach(p => { max = Math.max(max, p[1]); });
    if (max <= 0) max = 1;
    const path = pts.map((p, i) => (i ? "L" : "M") + ((i / (pts.length - 1)) * w).toFixed(1) + "," + (h - (p[1] / max) * (h - 4)).toFixed(1)).join(" ");
    const line = document.createElementNS("http://www.w3.org/2000/svg", "path");
    line.setAttribute("d", path); line.setAttribute("fill", "none");
    line.setAttribute("stroke", "var(--success-color)"); line.setAttribute("stroke-width", "1.8");
    line.setAttribute("vector-effect", "non-scaling-stroke");
    svg.appendChild(line);
    return svg;
  }
  function fleetStat(label, value, sub) {
    const wrap = document.createElement("div"); wrap.className = "fleet-stat";
    const k = document.createElement("div"); k.className = "k"; k.textContent = label;
    const v = document.createElement("div"); v.className = "v"; v.textContent = value;
    wrap.append(k, v);
    if (sub) { const s = document.createElement("div"); s.className = "sub"; s.textContent = sub; wrap.appendChild(s); }
    return wrap;
  }
  function renderFleet(fleet) {
    const card = document.createElement("section"); card.className = "fleet-card";
    const head = document.createElement("div"); head.className = "fleet-head";
    const label = document.createElement("span"); label.className = "fleet-label"; label.textContent = t("fleet-title");
    const badge = document.createElement("span"); badge.className = "badge risk-" + (fleet.risk || "healthy"); badge.textContent = (fleet.risk && t("risk-" + fleet.risk) !== "risk-" + fleet.risk) ? t("risk-" + fleet.risk) : (fleet.risk || "");
    head.append(label, badge);
    const total = document.createElement("span"); total.className = "fleet-total";
    total.textContent = fmtMoney(fleet.remaining_usd) + (fleet.cap_usd > 0 ? " / " + fmtMoney(fleet.cap_usd) : "");
    head.appendChild(total);
    card.appendChild(head);
    const grid = document.createElement("div"); grid.className = "fleet-grid";
    grid.appendChild(fleetStat(t("fleet-eta"), inDur(fleet.fleet_eta_seconds), t("fleet-eta-sub")));
    grid.appendChild(fleetStat(t("fleet-first"), inDur(fleet.first_depletion_seconds), t("fleet-first-sub")));
    grid.appendChild(fleetStat(t("fleet-rate"), fleet.rate_per_hour ? "$" + Number(fleet.rate_per_hour).toFixed(3) + "/h" : "—"));
    let accountsSub = tf("fleet-accounts-sub", {n: fleet.total_accounts ?? 0, m: fleet.stale_accounts || 0});
    if (fleet.exhausted_accounts > 0) accountsSub += tf("fleet-exhausted-sub", {k: fleet.exhausted_accounts});
    grid.appendChild(fleetStat(t("fleet-accounts"), String(fleet.active_accounts ?? 0), accountsSub));
    card.appendChild(grid);
    card.appendChild(projectionChart(fleet.projection));
    if (fleet.at_deadline) {
      const dl = document.createElement("div"); dl.className = "pred-row meta";
      const frac = Math.round((fleet.at_deadline.fraction || 0) * 100);
      dl.innerHTML = "";
      const span = document.createElement("div"); span.className = "fleet-sub";
      span.textContent = tf("at-deadline", {
        t: new Date(fleet.at_deadline.deadline).toLocaleString(),
        m: fmtMoney(fleet.at_deadline.available_usd),
        n: fleet.at_deadline.available_accounts, f: frac
      });
      dl.appendChild(span); card.appendChild(dl);
    }
    return card;
  }
  function renderWindow(win) {
    const row = document.createElement("div"); row.className = "pred-row";
    const head = document.createElement("div"); head.className = "pred-row-head";
    const label = document.createElement("span"); label.className = "pred-row-label"; label.textContent = windowLabel(win.name);
    const remaining = document.createElement("span"); remaining.className = "pred-row-remaining";
    remaining.textContent = win.unit === "pct" ? Math.round(win.remaining) + "%" : fmtMoney(win.remaining) + (win.cap ? " / " + fmtMoney(win.cap) : "");
    head.append(label, remaining); row.appendChild(head);
    const frac = win.unit === "pct" ? win.remaining / 100 : (win.cap > 0 ? win.remaining / win.cap : 0);
    const track = document.createElement("div"); track.className = "pred-track";
    const fill = document.createElement("div"); fill.className = "pred-fill" + (frac < 0.1 ? " bad" : frac < 0.3 ? " warn" : "");
    fill.style.width = Math.max(0, Math.min(100, frac * 100)) + "%";
    track.appendChild(fill); row.appendChild(track);
    const eta = document.createElement("div"); eta.className = "pred-eta";
    const main = document.createElement("span"); main.className = "pred-eta-main"; main.textContent = etaMain(win);
    const sub = document.createElement("span"); sub.className = "pred-eta-sub"; sub.textContent = etaSub(win);
    eta.append(main, sub); row.appendChild(eta);
    const meta = document.createElement("div"); meta.className = "pred-row-meta";
    const confKey = "conf-" + (win.confidence || "low");
    const conf = document.createElement("span"); conf.className = "badge " + confKey; conf.textContent = t(confKey);
    meta.appendChild(conf);
    const bits = [fmtRate(win.rate_per_hour, win.unit), (win.samples || 0) + t("n-samples")];
    if (win.accelerated) bits.push(t("fast-sampling"));
    if (win.resets_at) bits.push(t("resets") + " " + new Date(win.resets_at).toLocaleString());
    bits.forEach(b => { const s = document.createElement("span"); s.textContent = b; meta.appendChild(s); });
    row.appendChild(meta);
    const spark = sparkline(win.series, 110, 26);
    if (spark) row.appendChild(spark);
    row.style.clear = "both";
    return row;
  }
  function renderAccount(acc) {
    const card = document.createElement("section"); card.className = "pred-card" + (acc.status === "exhausted" ? " is-dark" : "");
    const header = document.createElement("div"); header.className = "pred-card-header";
    const badge = document.createElement("span"); badge.className = "credential-badge"; badge.textContent = "OL"; badge.setAttribute("aria-hidden", "true");
    const title = document.createElement("h2"); title.className = "credential-name"; title.textContent = acc.label || acc.key_id;
    header.append(badge, title);
    if (acc.status === "exhausted") {
      const wait = document.createElement("span"); wait.className = "badge state-exhausted";
      wait.textContent = acc.next_reset
        ? tf("acct-back", {t: new Date(acc.next_reset).toLocaleString()})
        : t("acct-exhausted");
      header.appendChild(wait);
    }
    card.appendChild(header);
    const sub = document.createElement("p"); sub.className = "pred-card-sub" + (acc.stale ? " pred-stale" : "");
    sub.textContent = acc.stale
      ? tf("stale-sub", {t: acc.updated_at ? new Date(acc.updated_at).toLocaleString() : t("never")})
      : (!acc.updated_at ? t("waiting-first") : tf("sampled-at", {t: new Date(acc.updated_at).toLocaleString()}));
    card.appendChild(sub);
    if (!(acc.windows || []).length) {
      const p = document.createElement("div"); p.className = "pred-muted"; p.textContent = t("no-window-yet");
      card.appendChild(p);
    } else {
      acc.windows.forEach(win => card.appendChild(renderWindow(win)));
    }
    const actions = document.createElement("div"); actions.className = "deadline-row";
    const btn = document.createElement("button"); btn.className = "pred-btn"; btn.textContent = t("resample");
    btn.onclick = async () => {
      btn.disabled = true; btn.textContent = t("queued");
      try { await request({refresh: true, key_id: acc.key_id}); } catch (_) {}
      setTimeout(load, 3000);
    };
    actions.appendChild(btn); card.appendChild(actions);
    return card;
  }
  function render(data) {
    app.textContent = "";
    renderPersistBanner(data);
    const fleet = data.by_type && data.by_type.ollama;
    if (fleet) app.appendChild(renderFleet(fleet));
    const accounts = data.accounts || [];
    if (!accounts.length) {
      const p = document.createElement("p"); p.className = "pred-muted"; p.textContent = t("no-credentials"); app.appendChild(p);
    } else {
      const grid = document.createElement("div"); grid.className = "pred-grid";
      accounts.forEach(acc => grid.appendChild(renderAccount(acc)));
      app.appendChild(grid);
    }
    if (metaLine) {
      metaLine.textContent = tf("meta", {
        t: data.generated_at ? new Date(data.generated_at).toLocaleString() : "—",
        s: Math.round(REFRESH_MS / 1000)
      });
    }
  }
  // D10: persistence degradation is visible, not silent.
  function renderPersistBanner(data) {
    const st = data.persistence;
    if (!st || st.state === "ok") return;
    const msgKey = "persist-" + st.state;
    const msg = (msgKey in I18N[lang] || msgKey in I18N.en) ? t(msgKey) : st.state;
    const banner = document.createElement("div"); banner.className = "pred-banner";
    const tag = document.createElement("span"); tag.className = "pred-banner-tag"; tag.textContent = t("persist-tag");
    const msgEl = document.createElement("span"); msgEl.textContent = msg;
    banner.appendChild(tag); banner.appendChild(msgEl);
    if (st.detail) {
      const det = document.createElement("span"); det.className = "pred-banner-detail"; det.textContent = "(" + st.detail + ")";
      banner.appendChild(det);
    }
    app.appendChild(banner);
  }
  function saveData(data) {
    try { localStorage.setItem(storageKey, JSON.stringify({data, at: new Date().toISOString()})); } catch (_) {}
  }
  function paintCache() {
    try {
      const parsed = JSON.parse(localStorage.getItem(storageKey) || "null");
      if (parsed && parsed.data && parsed.data.by_type) render(parsed.data);
    } catch (_) {}
  }
  function fail(key) {
    const e = new Error(t(key));
    e.i18nKey = key;
    return e;
  }
  function repaintLastError() {
    app.textContent = "";
    const p = document.createElement("p"); p.className = "pred-error"; p.setAttribute("role", "status");
    p.textContent = (lastErrorKey ? t(lastErrorKey) : "") || lastErrorText || t("load-failed");
    app.appendChild(p);
  }
  function renderAuthFailure(status) {
    app.textContent = "";
    const p = document.createElement("p"); p.className = "pred-error"; p.setAttribute("role", "status");
    p.textContent = authMessage(status);
    const h = document.createElement("p"); h.className = "pred-muted"; h.textContent = t("auth-hint");
    app.append(p, h);
  }
  function applyI18nStatic() {
    document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
    const title = document.getElementById("pred-title");
    const description = document.getElementById("pred-description");
    const toggle = document.getElementById("pred-lang");
    if (title) title.textContent = t("title");
    if (description) description.textContent = t("description");
    if (toggle) toggle.textContent = lang === "zh" ? "EN" : "中文";
    if (metaLine && !lastData) {
      metaLine.textContent = authFailStatus || lastErrorText ? "" : t("loading");
    }
    const loadingNode = app.querySelector("p.pred-muted");
    if (!lastData && !authFailStatus && !lastErrorText && loadingNode) loadingNode.textContent = t("loading");
  }
  function setLangView() {
    try { localStorage.setItem(langKey, lang); } catch (_) {}
    document.title = t("title");
    applyI18nStatic();
    if (lastData) render(lastData);
    else if (authFailStatus) renderAuthFailure(authFailStatus);
    else if (lastErrorText) repaintLastError();
    else paintCache();
  }
  async function load() {
    if (loading) return;
    loading = true;
    try {
      const data = await request({});
      lastData = data;
      saveData(data);
      render(data);
    } catch (err) {
      lastErrorKey = err && err.i18nKey ? err.i18nKey : "";
      lastErrorText = err.message || t("load-failed");
      repaintLastError();
    } finally { loading = false; }
  }
  document.title = t("title");
  const toggle = document.getElementById("pred-lang");
  if (toggle) {
    toggle.textContent = lang === "zh" ? "EN" : "中文";
    toggle.onclick = () => {
      lang = lang === "zh" ? "en" : "zh";
      setLangView();
    };
  }
  applyI18nStatic();
  const initialAuth = authStatus();
  if (initialAuth.key) {
    authKey = initialAuth.key;
    paintCache();
    load();
    setInterval(load, REFRESH_MS);
  } else {
    const retryAuth = initialAuth.status === "storage-blocked" ? authStatus() : initialAuth;
    if (!retryAuth.key) {
      authFailStatus = retryAuth.status;
      renderAuthFailure(authFailStatus);
      applyI18nStatic();
      return;
    }
    authKey = retryAuth.key;
    paintCache();
    load();
    setInterval(load, REFRESH_MS);
  }
})();
</script>
</body>
</html>
